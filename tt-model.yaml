schema: "5.1"
repo: sunandbean/qwen3.6-35b-a3b-p100a
name: qwen3.6-35b-a3b-p100a
# Base weights: Lottolabs' Tenstorrent-native GPTQ BFP4/BFP8 checkpoint (Apache-2.0), pinned. Only checkpoint/ is used
# (~21 GB); the repo also carries a 5.5 GB runtime image and evaluation evidence that this server never reads.
# The BFP8 upgrade layers (6.0 GB, on by default) are NOT this pointer: they are bfp8/ in this package's own repo and
# the server fetches them on first start (tt_qwen36/weights.py; Q36_BFP8_SOURCE below).
weights:
  repo: Lottolabs/Qwen3.6-35B-A3B-TT-Mixed-BFP4-BFP8-P150
  revision: c355c41d4fd079c6df3c4ba9bab1c40f37c17f09
  allow_patterns:
    - "checkpoint/*"
    - "LICENSE"
    - "README.md"
kind: http-server
arch: blackhole

image:
  registry: hf

source:
  # 58648d4 = tag v0.80.0-dev20260921, the tt-metal every measurement on the model card was taken on
  tt_metal: {repo: https://github.com/tenstorrent/tt-metal, ref: 58648d44443223041148125843ca7c7d4780463e}
  code:
    # tt-model needs at least one path from the tt-metal tree; models/common is what the other p100a ports ship.
    # The server does not import it.
    - models/common
  extra_code:
    - root: {repo: https://github.com/SunandBean/tt-qwen3.6-35b-a3b-p100a, ref: v0.1.0}
      paths: [tt_qwen36, tools]
  ubuntu: "22.04"
  python: "3.12"

runtime:
  command: [python, -m, tt_qwen36.server, --host, "{host}", --port, "{port}"]
  ready_line: '"event": "ready"'
  packages:
    - jinja2
    - safetensors
    - huggingface_hub
    - regex                 # the tokenizer's pre-tokenizer

serve:
  port: 8000
  hardware: p100a
  mesh_device: P100
  env:
    ARCH_NAME: blackhole
    # BFP8 upgrade layers: hf (default; bfp8/ of this repo) | dir (Q36_BFP8_DIR) | bf16 (convert locally from the
    # Qwen BF16 original, ~67 GB download) | off (Lottolabs GPTQ BFP4 only; needed for --ctx 262144)
    Q36_BFP8_SOURCE: hf
    # After bfp8/ is uploaded, pin the commit that added it here (the files are also checked against
    # tt_qwen36/bfp8_sha256.txt, so "main" only decides where they are fetched from, not what is accepted).
    Q36_BFP8_REVISION: main

serve_profiles:
  - name: default
    description: 32k context, up to 4 users (time slicing with MTP for 1-2, batched decode for 3-4), prefix cache.
  - name: long-128k
    description: 131,072-token context, one request at a time.
    args: [--ctx, "131072", --batch, "0", --prefix-slots, "1", --max-concurrent, "1"]
  - name: long-262k
    description: 262,144-token context, one request at a time, without the BFP8 upgrade layers (they do not fit).
    args: [--ctx, "262144", --batch, "0", --prefix-slots, "0", --max-concurrent, "1"]
    env:
      Q36_BFP8_SOURCE: "off"
default_profile: default

verify:
  # import EVERY module (several are imported lazily at start-up, so a missing dependency would otherwise only show
  # on a consumer's first boot)
  - "import tt_qwen36.server, tt_qwen36.api, tt_qwen36.chat, tt_qwen36.sessions, tt_qwen36.prefix, tt_qwen36.kkv, tt_qwen36.kgdn, tt_qwen36.bfp4"
  - "import tt_qwen36.q36.model, tt_qwen36.q36.spec, tt_qwen36.q36.batch, tt_qwen36.q36.bsched, tt_qwen36.q36.kgdn, tt_qwen36.q36.kmoe"
  - "import tt_qwen36.ref.q36_tok, tt_qwen36.ref.q36_weights, tt_qwen36.ref.third_party.strata_tokenizer"
  - "import tt_qwen36.weights as w; assert w.LOTTO_REVISION and len(w.checksums()) == 272"
  - "import jinja2, safetensors, huggingface_hub, regex"

card:
  description: >
    Qwen3.6-35B-A3B (35B total / 3B active MoE, 256 experts, gated delta net + gated attention, MTP head) served
    entirely from one Tenstorrent Blackhole p100a card, with an OpenAI- and Anthropic-compatible API (chat
    completions, responses, messages, tool calls, streaming). Base weights: Lottolabs' GPTQ BFP4/BFP8 checkpoint
    (Apache-2.0), plus 6.0 GB of BFP8 upgrade layers converted from the Qwen BF16 original.
  quickstart: |
    ### Requests

    The server is OpenAI- and Anthropic-compatible; the model id is `qwen3.6-35b-a3b-p100a`.

    ```bash
    curl -s localhost:20000/v1/chat/completions -H 'Content-Type: application/json' \
      -d '{"model":"qwen3.6-35b-a3b-p100a","messages":[{"role":"user","content":"Hello!"}],"max_tokens":200}'
    curl -s localhost:20000/v1/messages -H 'Content-Type: application/json' -H 'anthropic-version: 2023-06-01' \
      -d '{"model":"qwen3.6-35b-a3b-p100a","max_tokens":200,"messages":[{"role":"user","content":"Hello!"}]}'
    ```

    The first start downloads the 6.0 GB of BFP8 upgrade layers (`bfp8/` of this repo) into your HF cache and
    compiles kernels; later starts take about 35 s. `Q36_BFP8_SOURCE=off` serves with the Lottolabs weights only.
  architecture: Qwen3.6-35B-A3B MoE (gated delta net + gated attention, 256 experts top-8 + shared, MTP), all on one card
  status: community port; tested end to end on one p100a (tt-model serve, OpenAI + Anthropic requests)
  performance: |
    Measured 2026-11-13/14 on one idle p100a through the HTTP server, default profile (BFP8 upgrade layers on, MTP
    speculative decoding with up to 3 drafts, adaptive draft count), greedy.

    | | chat | code | doc |
    |---|---:|---:|---:|
    | decode, one user (tok/s) | 81.9 | 105.9 | 88.7 |
    | MTP draft acceptance | 0.51 | 0.73 | 0.57 |
    | prompt reading, 40-60-token prompts (tok/s) | 566 | 500 | 590 |

    | users at once | 1 | 2 | 3 | 4 |
    |---|---:|---:|---:|---:|
    | total decode tok/s (time slicing for 1-2, batched decode for 3-4) | 106.7 | 95.2 | 91.2 | 112.4 |

    Quality, teacher-forced on 1,532 positions against a float32 run of the original BF16 Qwen3.6-35B-A3B:
    **KL 0.0130, top-1 agreement 0.971** with the BFP8 upgrade layers (default); 0.0173 / 0.963 with Lottolabs'
    GPTQ BFP4 experts only (`Q36_BFP8_SOURCE=off`). GSM8K, first 50, max 2,048 tokens: **49/50**.

    Long context (needle in a haystack, passkey at half depth): found at 14k / 60k / 110k tokens with
    `--ctx 131072` (prompt read in 38 / 250 / 655 s), and at 184k tokens with `--ctx 262144` and the upgrade layers
    off (1,497 s, 123 tok/s prompt reading). Decode on a short prompt: 105-107 tok/s at `--ctx 131072`, 117.8 tok/s
    at `--ctx 262144` (upgrade off).

    From this package (`tt-model serve`, fresh caches, cold kernel cache, 2026-11-14): ready in 1 min 20 s;
    one OpenAI chat request at 84 tok/s decode. Weights on the card: 23.75 GB (20.91 GB with the upgrade off).
  limitations: |
    - One p100a only (mesh 1x1); no multi-card scaling.
    - 262k context only without the BFP8 upgrade layers (profile `long-262k`); BFP8 KV cache is not supported.
    - Prompt reading slows with length (590 tok/s at 50 tokens, ~240 tok/s at 60k, ~170 tok/s at 110k, 123 tok/s at
      184k).
    - The first start downloads 6.0 GB more (`bfp8/` of this repo) inside the container, with no progress bar in
      `tt-model serve`; `tt-model logs -f` shows it.
    - `tt-model serve` refuses while any other container holds `/dev/tenstorrent` (tt-model's busy-chip check), even
      an idle one; stop that service first.
    - Greedy output can differ at a near-tie token between a cold request and one resumed from the prefix cache.
    - Agents such as Claude Code ask for thinking on every turn; serve with `--thinking off` for faster agent turns.
    - `P100A_Q36_FUSED=0` (a debug switch for the unfused gated-delta-net path) is broken; the default is unaffected.
